[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powerclone-chi2"
version = "1.0.0"
description = "Clean-room reimplementation of chi-square contingency power analysis (YZM301 teardown sprint)"
requires-python = ">=3.10"
dependencies = ["scipy>=1.10"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
agent = ["mcp>=1.0", "anthropic>=0.40"]
dev = ["pytest>=8", "statsmodels>=0.14", "mcp>=1.0"]

[project.scripts]
gpower-clone = "powerclone.cli:main"
powerclone-mcp = "powerclone.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
